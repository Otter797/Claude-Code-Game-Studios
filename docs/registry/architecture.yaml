# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: multiplayer_networking
    status: active
    api: Netcode for GameObjects (com.unity.netcode.gameobjects), host-authoritative client-server topology
    not: UNet, Mirror, Photon, dedicated server
    adr: docs/architecture/adr-0001-network-model.md
    reason: "Official stack covered by the engine reference; host mode fits players-versus-AI co-op and solo as a one-player host"
    referenced_by:
      - docs/architecture/adr-0001-network-model.md
    added: 2026-11-26
    revised: ""

  - purpose: rpc_declaration
    status: active
    api: "[Rpc(SendTo...)] attribute with an Rpc method-name suffix"
    not: "[ServerRpc] / [ClientRpc] for new code"
    adr: docs/architecture/adr-0001-network-model.md
    reason: "Recommended form in the Netcode for GameObjects 3.2.1 manual, read 2026-11-26"
    referenced_by:
      - docs/architecture/adr-0001-network-model.md
    added: 2026-11-26
    revised: ""

  - purpose: solo_session_transport
    status: active
    api: SinglePlayerTransport, assigned before the host starts
    not: a network socket transport for solo play
    adr: docs/architecture/adr-0001-network-model.md
    reason: "Solo must work offline with no firewall prompt and no network error"
    referenced_by:
      - docs/architecture/adr-0001-network-model.md
    added: 2026-11-26
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
