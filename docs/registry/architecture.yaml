# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: "superseded_by: ADR-NNNN" instead,
#     quoted: unquoted, the second colon makes the file invalid YAML.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="superseded_by: ADR-"
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts with its section's name key ("- state:", "- contract:", "- system:"
#   or "- target_fps:" for the frame budget, "- purpose:", "- pattern:"), the
#   dash at column 2 (or 0, the same for every entry of a section); its fields
#   sit two columns past the dash. Quote a value that holds ": ", such as
#   "superseded_by: ADR-NNNN". A line in any other shape is reported as
#   unsupported layout, with its number.

version: 1
last_updated: "2026-11-27"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: run_and_player_state
    status: active
    owner_system: session-host-authority
    adr: docs/architecture/adr-0001-network-model.md
    interface: "Replicated state published by the Authority layer (read-only on every client); changes only by a request the host validates through the Simulation. Covers pack, tool, oxygen, health, ore seams, creatures and hunters, run clock, extraction, stash, crafting."
    write_access: host-only
    referenced_by:
      - docs/architecture/adr-0001-network-model.md
      - docs/architecture/adr-0002-persistence.md   # saves and loads the stash and progress part of it
      - docs/architecture/adr-0003-home-and-storm-persistence.md   # adds the home model and storm clock as host-owned state
    added: 2026-11-26
    revised: ""

  - state: persistent_profile
    status: active
    owner_system: persistence-service
    adr: docs/architecture/adr-0002-persistence.md
    # Old value (before ADR-0003, 2026-11-27): "ISaveStore.Load() / Save(SaveModel), called only by the host's Authority layer; the Simulation exchanges a plain SaveModel and never touches files. Covers stash, gear, recipes, statistics and the run marker."
    interface: "The host's Authority layer hands immutable SaveModel snapshots to ISaveQueue; only the queue's single writer calls ISaveStore.Load() / Save(SaveModel). The Simulation exchanges a plain SaveModel and never touches files. Covers the home (structures and pieces), containers keyed by piece id, carried items, the storm clock, gear, recipes, statistics and the run marker."
    write_access: host-only
    referenced_by:
      - docs/architecture/adr-0002-persistence.md
      - docs/architecture/adr-0003-home-and-storm-persistence.md   # extends the save model and moves the write off the main thread
    added: 2026-11-26
    revised: 2026-11-27

  - state: home_model
    status: active
    owner_system: building
    adr: docs/architecture/adr-0003-home-and-storm-persistence.md
    interface: "Session-level Simulation state, never owned by a scene object. Changed only through Building's TryPlace / TryRemove / TryRepairAll (each returns a change list and a new revision number) and IStructureDamage; read through the shelter query IsSheltered(pieceId), a pure function of the model. Pieces reach Presentation as data, never one networked object each."
    write_access: host-only
    referenced_by:
      - docs/architecture/adr-0003-home-and-storm-persistence.md
    added: 2026-11-27
    revised: ""

  - state: storm_clock
    status: active
    owner_system: storms
    adr: docs/architecture/adr-0003-home-and-storm-persistence.md
    interface: "Play time in milliseconds advanced only by the Simulation tick, plus the saved next storm (time, strength) and generator state. Storms are resolved only by Storms' AdvanceTo(playTimeMs), which returns StormReport values; other systems read the next storm's time and strength and never write the clock."
    write_access: host-only
    referenced_by:
      - docs/architecture/adr-0003-home-and-storm-persistence.md
    added: 2026-11-27
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | "superseded_by: ADR-NNNN"
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health (read-only float, range 0–max_health)"
#     write_access: health-system-only   # only owner can write; others read
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: player_intent_request
    status: active
    pattern: rpc
    producer: presentation
    consumers:
      - session-host-authority
    adr: docs/architecture/adr-0001-network-model.md
    signal_signature: "One client-to-host request per player intent (mine, pick up, extract, craft); the host validates through IRunSimulation and never trusts a client-supplied result"
    referenced_by:
      - docs/architecture/adr-0001-network-model.md
    added: 2026-11-26
    revised: ""

  - contract: save_request
    status: active
    pattern: direct_call
    producer: session-host-authority
    consumers:
      - persistence-service
    adr: docs/architecture/adr-0003-home-and-storm-persistence.md
    signal_signature: "ISaveQueue.Request(snapshot) returns at once; RequestAndWait(snapshot) completes with success, failure or timed-out; NotePlayTime(playTimeMs); Drain(). One pending snapshot and one pending note, newest wins within each kind. Only the queue's writer calls ISaveStore."
    referenced_by:
      - docs/architecture/adr-0003-home-and-storm-persistence.md
    added: 2026-11-27
    revised: ""

  - contract: storm_damage_delivery
    status: active
    pattern: direct_call
    producer: storms
    consumers:
      - building
      - stash
    adr: docs/architecture/adr-0003-home-and-storm-persistence.md
    signal_signature: "Storms decides the damage and calls Building's IStructureDamage (apply a storm of a given strength), Building's shelter query, and Stash's container-clearing call. Building and Stash never reference Storms; Run Flow never calls Storms."
    referenced_by:
      - docs/architecture/adr-0003-home-and-storm-persistence.md
    added: 2026-11-27
    revised: ""

# Example:
#
# interfaces:
#   - contract: damage_delivery
#     status: active
#     pattern: signal          # how the producer notifies consumers
#     producer: combat-system
#     consumers:
#       - health-system        # receives damage_dealt signal, applies to health
#       - ui-system            # receives damage_dealt signal, shows damage number
