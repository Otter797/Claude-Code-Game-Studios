# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: persistence
    status: active
    budget_ms: 1.0
    adr: docs/architecture/adr-0003-home-and-storm-persistence.md
    notes: "Main-thread cost of one save point (the snapshot) with a 2,000-piece home, with near-zero managed allocation per save point. A target, not yet measured; serializing and file work run on the background writer."
    referenced_by:
      - docs/architecture/adr-0003-home-and-storm-persistence.md
    added: 2026-11-27
    revised: ""

# Example:
#
# performance_budgets:
#   - target_fps: 60
#     total_frame_budget_ms: 16.6
#     platform: PC             # PC | Console | Mobile | All
