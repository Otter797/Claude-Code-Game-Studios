#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: presentation_writes_game_state
    status: active
    description: "Views, HUD, audio, VFX and input code must never change game state or contain a rule (a threshold, a cost, a yield)."
    why: "State must have one writer, the host, or co-op diverges and loot can duplicate."
    adr: docs/architecture/adr-0001-network-model.md
    added: 2026-11-26

  - pattern: simulation_references_netcode
    status: active
    description: "Simulation code must never reference the Netcode package, MonoBehaviour lifecycle, scene singletons, or read assets itself."
    why: "Rules must be testable in EditMode without a scene or a session."
    adr: docs/architecture/adr-0001-network-model.md
    added: 2026-11-26

  - pattern: offline_only_rule_path
    status: active
    description: "There must never be a separate solo or offline code path for a rule; solo goes through ISessionHost.StartSolo() and the same request path as co-op."
    why: "A second path is never exercised by co-op and drifts from the first."
    adr: docs/architecture/adr-0001-network-model.md
    added: 2026-11-26

  - pattern: netcode_manager_singleton_access
    status: active
    description: "Code must never access the Netcode manager's singleton outside the ISessionHost implementation."
    why: "Hidden global coupling makes systems untestable and ties them to one transport."
    adr: docs/architecture/adr-0001-network-model.md
    added: 2026-11-26

  - pattern: unet_usage
    status: active
    description: "UNet must never be used."
    why: "Deprecated per docs/engine-reference/unity/modules/networking.md."
    adr: docs/architecture/adr-0001-network-model.md
    added: 2026-11-26

  - pattern: simulation_file_io
    status: active
    description: "Simulation code must never read or write files; it exchanges a SaveModel with the persistence service only."
    why: "Rules must stay testable without a disk, and saves must have one writer on the host."
    adr: docs/architecture/adr-0002-persistence.md
    added: 2026-11-26

  - pattern: progress_in_engine_preferences
    status: active
    description: "Game progress must never be stored in the engine's preferences store (PlayerPrefs). Settings and key bindings may use it."
    why: "On Windows it is the registry: no atomic write, no backups, no versioning."
    adr: docs/architecture/adr-0002-persistence.md
    added: 2026-11-26

  - pattern: run_state_saved
    status: "superseded_by: ADR-0003"
    description: "Run state must never be saved, and backups must never be offered as a way to undo a loss. A run marker found at start-up resolves as a loss of the carried items."
    why: "Loss must stick; resuming or reloading a run removes the game's core stake."
    adr: docs/architecture/adr-0002-persistence.md
    added: 2026-11-26

  - pattern: run_state_saved_beyond_play_time
    status: active
    description: "Run state must never be saved, with one exception: the play-time note, which holds only the profile id and the storm clock. The pack is not saved during a run, a run can never be resumed, and backups must never be offered as a way to undo a loss. A run marker found at start-up resolves as a loss of the carried items."
    why: "Loss must stick; an abandoned run must still count the time actually played."
    adr: docs/architecture/adr-0003-home-and-storm-persistence.md
    added: 2026-11-27

  - pattern: home_state_in_scene_or_physics
    status: active
    description: "The home model and storm clock must never be owned by scene objects or read back from the scene, and the shelter check must never use physics, colliders or a loaded scene."
    why: "The home scene is not loaded during a run, and rules must be testable without a scene."
    adr: docs/architecture/adr-0003-home-and-storm-persistence.md
    added: 2026-11-27

  - pattern: action_split_across_writes
    status: active
    description: "An action's cost and its result (materials spent, piece added) must never be saved by separate writes or in separate files; both go in one snapshot of the one save document."
    why: "A crash between two writes would duplicate or destroy materials."
    adr: docs/architecture/adr-0003-home-and-storm-persistence.md
    added: 2026-11-27

  - pattern: second_storm_path_or_wall_clock
    status: active
    description: "Storms must never be resolved anywhere but Storms' AdvanceTo, and the storm clock must never read the wall clock or depend on the engine's time scale."
    why: "Home, run end and crash recovery must give the same result, and storms must not run while the game is closed."
    adr: docs/architecture/adr-0003-home-and-storm-persistence.md
    added: 2026-11-27

