# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: container_worth
    status: active
    source: design/gdd/ore-and-item-economy.md
    referenced_by:
      - design/gdd/ore-and-item-economy.md
    variables:
      - count
      - worth
    output_range: [0, 1998000000000]
    expression: "sum over filled slots of count * worth(id); 64-bit"
    notes: "F5. Feeds the pack worth readout and glow, crew haul worth (sum of extraction minus sum of launch over the crew, floored at 0) and best-haul statistics."
    added: 2026-11-28
    revised: ""
  - name: price_in_runs
    status: active
    source: design/gdd/ore-and-item-economy.md
    referenced_by:
      - design/gdd/ore-and-item-economy.md
    variables:
      - count
      - worth
      - pacing_haul_worth
      - pacing_success_rate
      - expected_yield
    output_range: [0, 999999]
    expression: "max(sum(count * worth(id)) / (pacing_haul_worth * pacing_success_rate), max(count / expected_yield(id)))"
    notes: "F4. Validation-time report only. Bands (tuning): canister <= 0.15 runs, lost drill 0.5 to 1.0, repair <= 0.25, one-off 0.5 to 3, ceiling 15 to 30 runs. Yield price computed once Asteroid World publishes yields. Building and Crafting price against it."
    added: 2026-11-28
    revised: 2026-11-28
  - name: rebuild_stock_ok
    status: active
    source: design/gdd/home-valley.md
    referenced_by:
      - design/gdd/home-valley.md
    variables:
      - stock
      - need
      - rebuild_margin
    output_range: [false, true]
    expression: "stock(m) >= ceil(need(m) * rebuild_margin); stock(m) = sum of yield over spots giving m"
    notes: "F3. Validation refuses the catalog when false. need comes from Crafting and Building's rebuild set (workbench, hammer, basic drill, one shelter repair); provisional 40 rock and 40 stick until they define it. MVP stock 72 each, margin 1.25."
    added: 2026-11-28
    revised: ""
  - name: rebuild_gather_time
    status: active
    source: design/gdd/home-valley.md
    referenced_by:
      - design/gdd/home-valley.md
      - design/gdd/player-controller.md
    variables:
      - need
      - yield
      - t_pick
      - d_hop
      - d_home
      - walk_speed
    output_range: [0, 7000]
    expression: "sum over m of ceil(need(m)/yield(m)) * (t_pick + d_hop/walk_speed) + 2*d_home/walk_speed"
    notes: "F4. Validation warning above valley_gather_time_max_s (300 s, half the concept's 10-minute rebuild). t_pick is Gathering's, walk_speed Player Controller's. About 103 s with MVP values."
    added: 2026-11-28
    revised: ""
  - name: move_target_speed
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
    variables:
      - walk_speed
      - sprint_speed
      - full_pack_slow
      - fill
      - move
    output_range: [0, 12]
    expression: "(sprinting ? sprint_speed : walk_speed) * (1 - full_pack_slow * fill) * |move|"
    notes: "F1. full_pack_slow and fill are Pack's. MVP: empty walk 3.8, empty sprint 6.2, full walk 2.47, full sprint 4.03 m/s. Creature AI's burrower_speed 4.4 sits between, by design."
    added: 2026-11-28
    revised: ""
  - name: loaded_clock
    status: active
    source: design/gdd/save-and-load.md
    referenced_by:
      - design/gdd/save-and-load.md
    variables:
      - save.clock
      - note.clock
    output_range: [0, null]
    expression: "note readable and known version and same profile and note.clock > save.clock ? note.clock : save.clock"
    notes: "F1. The play-time clock a session starts with; never earlier than the main save's. Storms resolves due storms from it."
    added: 2026-11-28
    revised: ""

