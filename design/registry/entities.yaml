# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: note_interval_s
    status: active
    source: design/gdd/save-and-load.md
    referenced_by:
      - design/gdd/save-and-load.md
      - design/gdd/session-and-authority.md
    value: 30
    unit: s
    notes: "tuning.save_and_load; range 5 to 120; play time between play-time notes (ADR-0003 Decision 8); bounds storm-clock time a crash can lose (F2)"
    added: 2026-11-28
    revised: ""
  - name: walk_speed
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
      - design/gdd/home-valley.md
    value: 3.8
    unit: m/s
    notes: "tuning.player_controller; range 2 to 8; must stay at or below sprint_speed and below Creature AI's burrower_speed (4.4) by design intent"
    added: 2026-11-28
    revised: ""
  - name: sprint_speed
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
    value: 6.2
    unit: m/s
    notes: "tuning.player_controller; range 3 to 12; forward only; above burrower_speed empty, below it with a nearly full pack (crossover about 13 of 16 slots)"
    added: 2026-11-28
    revised: ""
  - name: step_offset
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
    value: 0.45
    unit: m
    notes: "tuning.player_controller; Building must keep walkable piece edges at or below it or provide stairs"
    added: 2026-11-28
    revised: ""
  - name: slope_limit_deg
    status: active
    source: design/gdd/player-controller.md
    referenced_by:
      - design/gdd/player-controller.md
      - design/gdd/home-valley.md
    value: 45
    unit: degrees
    notes: "tuning.player_controller; Home Valley's rim and Asteroid World's walls must be steeper"
    added: 2026-11-28
    revised: ""

