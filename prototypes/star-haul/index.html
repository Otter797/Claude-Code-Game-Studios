<script>
'use strict';
// Star Haul: one asteroid mining run, then home to unpack and craft.
// The starter's check hooks are kept: the fixed step, the clock hook, window.game and the
// play and figures scenes.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size of the HUD
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';
const TITLE = 'Star Haul';
const CONTROLS = [
  'W A S D: move      Mouse or arrow keys: look',
  'Hold left click or Space: drill      Shift: sprint (burns oxygen)',
  'E: use      Q: oxygen canister      P: pause      M: mute',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen: a 3D view with a 2D HUD canvas over it ---------------------------------------
const wrap = document.getElementById('wrap');
const view = document.getElementById('view');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: view, antialias: !CHEAP });
} catch (e) { events.push({ type: 'no-webgl' }); }
function fit() { // fills the window at any size and pixel ratio
  const s = Math.min(innerWidth / W, innerHeight / H);
  const r = s * (devicePixelRatio || 1);
  const cw = Math.round(W * s), ch = Math.round(H * s);
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  wrap.style.marginTop = Math.max(0, Math.floor((innerHeight - ch) / 2)) + 'px';
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  if (renderer) {
    renderer.setPixelRatio(CHEAP ? 0.5 : Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(cw, ch, false);
    view.style.width = cw + 'px'; view.style.height = ch + 'px';
  }
}
addEventListener('resize', fit); fit();

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
let mouseMine = false, locked = false;
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code === 'Tab' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => { down.clear(); mouseMine = false; });
wrap.addEventListener('pointerdown', e => {
  startAudio();
  if (scene === 'title') { hit.add('Enter'); }
  if (scene === 'pause') { hit.add('KeyP'); }
  if (!locked && wrap.requestPointerLock) { try { const p = wrap.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* no lock: the arrow keys look */ } }
  if (e.button === 0) mouseMine = true;
});
addEventListener('pointerup', e => { if (e.button === 0) mouseMine = false; });
document.addEventListener('pointerlockchange', () => {
  const now = document.pointerLockElement === wrap;
  if (locked && !now && (scene === 'play' || scene === 'home')) { state.prev = scene; scene = 'pause'; }
  locked = now; mouseMine = false;
});
addEventListener('mousemove', e => {
  if (!locked || !state || (scene !== 'play' && scene !== 'home')) return;
  state.p.yaw -= e.movementX * tune.look_sens;
  state.p.pitch = clamp(state.p.pitch - e.movementY * tune.look_sens, -1.35, 1.35);
});

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false, drillVoice = null, noiseBuf = null;
function startAudio() {
  if (!audio) {
    try {
      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
      const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
      out.connect(ac.destination); audio = { ac, out };
    } catch (e) { return; }
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3, slideTo = 0) {
  if (!audio || muted) return;
  try {
    const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
  } catch (e) { /* sound never stops the game */ }
}
function crunch(dur = 0.18, vol = 0.35) { // a burst of filtered noise: rock breaking
  if (!audio || muted) return;
  try {
    const ac = audio.ac;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); let s = 12345;
      for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647) * 2 - 1; }
    }
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 900;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(audio.out); src.start(t); src.stop(t + dur);
  } catch (e) { /* sound never stops the game */ }
}
function drillSound(on, frac) {
  if (!audio || muted) on = false;
  try {
    if (on && !drillVoice) {
      const o = audio.ac.createOscillator(), g = audio.ac.createGain();
      o.type = 'sawtooth'; g.gain.value = 0.07; o.connect(g).connect(audio.out); o.start();
      drillVoice = { o, g };
    }
    if (on && drillVoice) drillVoice.o.frequency.value = 62 + frac * 70;
    if (!on && drillVoice) { drillVoice.o.stop(); drillVoice = null; }
  } catch (e) { drillVoice = null; }
}

// ---- Small maths ------------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const dist = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);

// ---- The asteroid: one hand-made rock, the same every run ---------------------------------
// The walkable ground is a chain of overlapping discs from the landing pad to the Deep.
const DISCS = [
  { x: -100, z: 0, r: 35 },   // the landing pad (safe)
  { x: -60, z: 6, r: 32 },    // the Shallows
  { x: -22, z: -6, r: 20 },   // the Arch Pass
  { x: 20, z: -26, r: 42 },   // Midfield
  { x: 10, z: 30, r: 26 },    // Ember Shelf
  { x: 64, z: -4, r: 20 },    // the Ridge
  { x: 106, z: 12, r: 40 },   // the Deep
];
const SHIP = { x: -104, z: 0 };
const SPAWN = { x: -96.5, z: 0.5 };
function mask(x, z) {
  let m = -9;
  for (const c of DISCS) m = Math.max(m, 1 - Math.hypot(x - c.x, z - c.z) / c.r);
  return m;
}
function height(x, z) {
  let h = 1.4 * Math.sin(x * 0.07 + 1.3) * Math.cos(z * 0.09) + 0.8 * Math.sin(x * 0.19 + z * 0.13)
    + 0.35 * Math.sin(x * 0.5) * Math.sin(z * 0.43) + 0.1 * Math.sin(x * 1.3 + z * 0.6) * Math.sin(z * 1.1 - x * 0.4);
  h *= 1 - sstep(0.25, 0.7, 1 - Math.hypot(x - SHIP.x, z - SHIP.z) / 35); // the pad is flat
  h -= 7 * sstep(0, 0.6, 1 - Math.hypot(x - 106, z - 12) / 46);           // the Deep sinks
  h += 4 * sstep(0, 0.7, 1 - Math.hypot(x - 10, z - 30) / 30);            // the Shelf rises
  const m = mask(x, z);
  if (m < 0) h -= Math.min(1, -m * 1.5) * 45 + (-m) * 6;                  // the cliff into the void
  return h;
}
function zoneName(x, z) {
  if (dist(x, z, SHIP.x, SHIP.z) < tune.safe_radius) return 'Landing Pad';
  if (x < -36) return 'The Shallows';
  if (x < -4) return 'Arch Pass';
  if (x < 36 && z > 10) return 'Ember Shelf';
  if (x < 52) return 'Midfield';
  if (x < 78) return 'The Ridge';
  return 'The Deep';
}
const ORE = {
  glint: { name: 'Glint', color: 0x1fa8ff, css: '#3cb4ff' },
  ember: { name: 'Ember', color: 0xff7a14, css: '#ff8a2a' },
  verdite: { name: 'Verdite', color: 0x10c95c, css: '#22d46a' },
  sunstone: { name: 'Sunstone', color: 0xffd000, css: '#ffd91a' },
};
const ORE_KEYS = ['glint', 'ember', 'verdite', 'sunstone'];
const oreValue = k => tune['value_' + k];
const oreTough = k => tune['tough_' + k];
// Each seam: where it is, what it holds, how many pieces.
const SEAMS = [
  // the pad and its edge: safe, poor
  [-92, 0.5, 'glint', 3], [-88, 16, 'glint', 3], [-84, -18, 'glint', 3], [-74, 4, 'glint', 4],
  // the Shallows
  [-62, 24, 'glint', 4], [-52, -14, 'glint', 4], [-44, 10, 'glint', 5],
  // the Arch Pass
  [-24, -16, 'glint', 4], [-16, 2, 'ember', 3],
  // Midfield
  [4, -30, 'ember', 4], [18, -50, 'ember', 4], [30, -22, 'ember', 5], [38, -46, 'ember', 4],
  [10, -10, 'glint', 5], [26, -4, 'glint', 4], [44, -28, 'verdite', 2],
  // Ember Shelf
  [2, 34, 'ember', 5], [16, 44, 'ember', 4], [22, 30, 'verdite', 3],
  // the Ridge
  [60, -12, 'ember', 4], [70, 2, 'verdite', 3],
  // the Deep
  [92, -4, 'verdite', 4], [100, 28, 'verdite', 5], [118, 0, 'verdite', 4], [126, 22, 'verdite', 4],
  [88, 18, 'ember', 4], [108, 14, 'sunstone', 3], [124, -12, 'sunstone', 3], [96, 40, 'sunstone', 3],
  [134, 10, 'sunstone', 3],
].map(s => ({ x: s[0], z: s[1], type: s[2], n: s[3] }));
// Each creature sleeps at its hole until noise wakes it.
const DENS = [
  ['burrower', -48, -6], ['burrower', -6, -12],
  ['burrower', 12, -40], ['burrower', 34, -32], ['burrower', 22, -14], ['spitter', 46, -36],
  ['burrower', 10, 40], ['burrower', 20, 36],
  ['burrower', 64, -6], ['spitter', 72, -10],
  ['burrower', 96, 4], ['burrower', 112, 26], ['burrower', 120, 6], ['burrower', 104, 34],
  ['burrower', 130, -4], ['spitter', 110, 8], ['spitter', 128, 16], ['spitter', 98, 24],
].map(d => ({ kind: d[0], x: d[1], z: d[2] }));
// Boulders and spires: landmarks and cover. [x, z, radius, how tall]
const ROCKS = [
  [-112, 18, 2.2, 1], [-116, -14, 3, 1.1], [-90, -26, 2.5, 0.9], [-84, 28, 2, 1],
  [-70, -10, 3.2, 1.2], [-66, 18, 2.4, 0.9], [-56, 30, 4, 1.3], [-50, 4, 2, 0.8], [-42, -20, 3.6, 1.1],
  [-38, 22, 2.8, 1], [-58, -22, 2.5, 1],
  [-27, 1, 2.6, 2.6], [-19, -13, 2.6, 2.6], // the arch's two pillars
  [0, -20, 3, 1.1], [8, -46, 4.5, 1.2], [22, -37, 2.6, 0.9], [28, -58, 3.4, 1.3], [40, -14, 4, 1.4],
  [52, -44, 3, 1], [14, -2, 2.4, 0.9], [34, 4, 3.2, 1.1], [52, -22, 2.8, 1],
  [0, 22, 3, 1], [24, 47, 3.6, 1.3], [-6, 40, 2.6, 1], [28, 22, 2.4, 0.9],
  [58, 6, 3.4, 1.2], [70, -18, 3, 1.1], [77, 8, 2.6, 1],
  [98, -17, 2.6, 3.2], [114, 36, 3.4, 3.6], [120, -24, 3, 3], [139, 22, 3, 3.4], [106, -3, 2.2, 2.8],
  [86, 34, 3, 3], [131, 35, 2.6, 2.6], [142, -2, 3, 3.2],
].map(r => ({ x: r[0], z: r[1], r: r[2], tall: r[3] }));
const SOLIDS = []; // circles the player cannot walk through
for (const r of ROCKS) SOLIDS.push({ x: r.x, z: r.z, r: r.r * 0.85 });
for (const s of SEAMS) SOLIDS.push({ x: s.x, z: s.z, r: 2.0 });
for (const d of DENS) if (d.kind === 'spitter') SOLIDS.push({ x: d.x, z: d.z, r: 0.9 });
SOLIDS.push({ x: SHIP.x, z: SHIP.z, r: 3.4 });

// ---- Home: one room. A stash wall, a bench, a tool rack and the hatch ---------------------
const ROOM = { w: 20, d: 12 };
const STATIONS = [
  { id: 'stash', name: 'Stash', x: 0, z: -5.2 },
  { id: 'bench', name: 'Crafting bench', x: 8.3, z: 0 },
  { id: 'rack', name: 'Tool rack', x: -8.3, z: 0 },
  { id: 'hatch', name: 'Ship hatch', x: 0, z: 5.4 },
];
const WEALTH_STEPS = [100, 300, 600, 1000, 1500, 2200, 3000, 4000]; // stash worth that lights each lamp

// ---- The save: versioned, so a later build can migrate it ---------------------------------
const SAVE_KEY = 'star-haul-save-v1';
let save;
function freshSave() {
  return { version: 1, stash: { glint: 0, ember: 0, verdite: 0, sunstone: 0 }, drill2: 0, canisters: 0,
    best: 0, runs: 0, deaths: 0, goal: false, useDrill2: false };
}
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.version === 1 && s.stash) return s; } catch (e) { /* no save */ }
  return freshSave();
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private window */ } }
const stashWorth = () => ORE_KEYS.reduce((a, k) => a + save.stash[k] * oreValue(k), 0);
const packWorth = () => state.pack.reduce((a, k) => a + oreValue(k), 0);
const canCraftDrill = () => save.stash.glint >= tune.drill2_glint && save.stash.ember >= tune.drill2_ember && save.stash.verdite >= tune.drill2_verdite;
const canCraftCan = () => save.stash.glint >= tune.canister_glint && save.stash.ember >= tune.canister_ember;

// ---- State: plain data, everything a check can read ---------------------------------------
let scene, state;
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  save = loadSave();
  state = {
    t: 0, score: 0, gained: '', prev: 'play',
    p: { x: SPAWN.x, z: SPAWN.z, yaw: -Math.PI / 2, pitch: -0.08, bob: 0, moving: 0 },
    o2: 1, hp: tune.max_health, pack: [], worth: 0, drill: 1, canisters: 0,
    seams: SEAMS.map(s => ({ left: s.n, prog: 0, shake: 0 })),
    creatures: DENS.map((d, i) => ({ kind: d.kind, x: d.x, z: d.z, hx: d.x, hz: d.z, st: 'sleep', noise: 0, t: 0, cd: 0, stuns: 0, face: i * 1.3, hit: 0, tier: 0, hunter: false, wt: 0, wx: d.x, wz: d.z })),
    threat: 0, nextHunter: tune.hunter_first,
    globs: [], mining: false, target: -1, targetKind: '', frac: 0, prompt: '', promptBad: false,
    hurt: 0, shake: 0, toast: '', toastT: 0, zone: 'Landing Pad', beat: 0, stir: 0, time: 0, swapped: 0,
    home: { mode: 'walk', queue: [], qt: 0, haul: 0, counted: 0, banner: '', bannerT: 0, near: '' },
    lost: null,
  };
}
function startRun() {
  const s = save; reset(); save = s;
  state.drill = save.useDrill2 && save.drill2 > 0 ? 2 : 1;
  if (state.drill === 2) save.drill2--;                     // the drill leaves the rack: it is at risk
  state.canisters = Math.min(save.canisters, tune.canister_carry);
  save.canisters -= state.canisters;
  save.runs++; writeSave();
  toast('Landing Pad', 3);
  events.push({ type: 'run-start', drill: state.drill });
  scene = 'play';
}
function goHome(from) {
  const p = state.p; p.x = 0; p.z = 2.6; p.yaw = 0; p.pitch = -0.05;
  const h = state.home; h.mode = 'walk'; h.queue = []; h.banner = ''; h.bannerT = 0;
  if (from === 'extract') {
    if (state.drill === 2) save.drill2++;                   // the drill comes home
    save.canisters += state.canisters;
    h.queue = state.pack.slice().sort((a, b) => oreValue(a) - oreValue(b));
    h.haul = packWorth(); h.counted = 0; h.qt = 0.5;
    h.mode = h.queue.length ? 'unpack' : 'walk';
    if (!h.queue.length) banner('You came home with an empty pack.', 4);
    if (h.haul > save.best) save.best = h.haul;
  } else if (from === 'death') {
    banner(state.lost ? state.lost.line : '', 6);
    if (save.drill2 <= 0) save.useDrill2 = false;
  }
  state.pack = []; state.canisters = 0; state.drill = 1; state.mining = false;
  writeSave(); scene = 'home';
}
function die(why) {
  const n = state.pack.length, w = packWorth();
  const tool = state.drill === 2 ? 'your Better Drill' : 'your drill';
  state.lost = { why, n, w, line: `Lost out there: ${n} ore worth ${w}, and ${tool}. The stash is safe.` };
  state.gained = why;
  save.deaths++; if (save.drill2 <= 0) save.useDrill2 = false; writeSave();
  drillSound(false, 0); tone(180, 0.9, 'sawtooth', 0.4, 40);
  events.push({ type: 'death', why, lost: w });
  scene = 'over';
}
function toast(s, secs = 3) { state.toast = s; state.toastT = secs; }
function banner(s, secs = 5) { state.home.banner = s; state.home.bannerT = secs; }

// ---- Moving the player ------------------------------------------------------------------
function look(dt) {
  const p = state.p, k = tune.key_turn * dt;
  if (down.has('ArrowLeft')) p.yaw += k;
  if (down.has('ArrowRight')) p.yaw -= k;
  if (down.has('ArrowUp')) p.pitch = clamp(p.pitch + k * 0.7, -1.35, 1.35);
  if (down.has('ArrowDown')) p.pitch = clamp(p.pitch - k * 0.7, -1.35, 1.35);
}
function wish() { // the direction the keys ask for, in world x and z
  const p = state.p;
  const f = (down.has('KeyW') ? 1 : 0) - (down.has('KeyS') ? 1 : 0);
  const r = (down.has('KeyD') ? 1 : 0) - (down.has('KeyA') ? 1 : 0);
  if (!f && !r) return null;
  const fx = -Math.sin(p.yaw), fz = -Math.cos(p.yaw), rx = Math.cos(p.yaw), rz = -Math.sin(p.yaw);
  const x = fx * f + rx * r, z = fz * f + rz * r, l = Math.hypot(x, z);
  return { x: x / l, z: z / l };
}
function pushOut(nx, nz, solids, pad) {
  for (const s of solids) {
    const d = Math.hypot(nx - s.x, nz - s.z), min = s.r + pad;
    if (d < min && d > 0.0001) { nx = s.x + (nx - s.x) / d * min; nz = s.z + (nz - s.z) / d * min; }
  }
  return [nx, nz];
}

// ---- Play: the run ----------------------------------------------------------------------
function updatePlay(dt) {
  const p = state.p;
  state.t += dt; state.time += dt;
  look(dt);

  // move
  const w = wish();
  const sprint = down.has('ShiftLeft') || down.has('ShiftRight');
  const fill = state.pack.length / tune.pack_slots;
  let speed = (sprint ? tune.sprint_speed : tune.walk_speed) * (1 - tune.full_pack_slow * fill);
  p.moving = w ? (sprint ? 2 : 1) : 0;
  if (w) {
    let nx = p.x + w.x * speed * dt, nz = p.z + w.z * speed * dt;
    [nx, nz] = pushOut(nx, nz, SOLIDS, 0.5);
    if (mask(nx, nz) < 0.04) { // the rim: slide along it
      if (mask(nx, p.z) >= 0.04) nz = p.z; else if (mask(p.x, nz) >= 0.04) nx = p.x; else { nx = p.x; nz = p.z; }
    }
    p.x = nx; p.z = nz; p.bob += speed * dt;
  }

  // oxygen
  const use = (sprint && w ? tune.sprint_oxygen_mult : 1) / tune.oxygen_seconds;
  state.o2 = Math.max(0, state.o2 - use * dt);
  if (state.o2 <= 0) { state.hp -= tune.suffocate_dps * dt; state.hurt = Math.max(state.hurt, 0.4); }
  if (pressed('KeyQ')) {

function syncHome() {

function plate(x, y, w, h, a = 0.72) { ctx.fillStyle = `rgba(27,29,51,${a})`; rr(x, y, w, h, 10); ctx.fill(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function label(s, x, y, size, c = '#ffffff', align = 'center') { // text on its own dark plate, readable over any view
  ctx.font = ` ${size}px ${FONT}`; const w = ctx.measureText(s).width + 28, h = size + 16;
  const px = align === 'center' ? x - w / 2 : align === 'left' ? x - 14 : x - w + 14;
  plate(px, y - h / 2, w, h); text(s, x, y + 1, size, c, align);
}
function gem(x, y, r, css, on = true) { // a cut stone, seen from above
  ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 - Math.PI / 2; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath();
  if (!on) { ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5; ctx.stroke(); return; }
  ctx.fillStyle = css; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.5, y - r * 0.1); ctx.lineTo(x, y + r * 0.15); ctx.lineTo(x - r * 0.5, y - r * 0.1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(20,22,42,0.6)'; ctx.lineWidth = 1; ctx.stroke();
}
function tankIcon(x, y, c) { // an oxygen tank
  ctx.fillStyle = c; rr(x - 9, y - 14, 18, 30, 8); ctx.fill(); ctx.fillRect(x - 4, y - 21, 8, 8); ctx.fillRect(x - 9, y - 23, 18, 4);
}
function suitIcon(x, y, c) { // a helmet: the suit's health
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y - 2, 13, Math.PI, 0); ctx.lineTo(x + 13, y + 10); ctx.lineTo(x - 13, y + 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(27,29,51,0.85)'; rr(x - 8, y - 6, 16, 10, 4); ctx.fill();
}
function packIcon(x, y, fill) { // the pack: it glows brighter as it fills
  ctx.save(); ctx.shadowColor = `rgba(255,236,170,${0.25 + fill * 0.75})`; ctx.shadowBlur = 6 + fill * 26;
  ctx.fillStyle = '#f1dc9a'; rr(x - 17, y - 18, 34, 38, 9); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#cdb673'; rr(x - 17, y - 18, 34, 15, 8); ctx.fill();
  ctx.fillStyle = '#8c86a8'; ctx.fillRect(x - 3, y - 8, 6, 9); ctx.fillRect(x - 12, y - 25, 5, 9); ctx.fillRect(x + 7, y - 25, 5, 9);
}
function bar(x, y, w, h, frac, c) {
  ctx.fillStyle = 'rgba(255,255,255,0.16)'; rr(x, y, w, h, h / 2); ctx.fill();
  if (frac > 0.01) { ctx.fillStyle = c; rr(x, y, Math.max(h, w * clamp(frac, 0, 1)), h, h / 2); ctx.fill(); }
}
function arrow(x, y, ang, size, c) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = c;
  ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(size * 0.7, size * 0.7); ctx.lineTo(0, size * 0.3); ctx.lineTo(-size * 0.7, size * 0.7); ctx.closePath(); ctx.fill(); ctx.restore();
}
function bearing(x, z) { // the angle on screen from straight ahead to a place: 0 ahead, positive to the right
  const p = state.p, dx = x - p.x, dz = z - p.z;
  const fx_ = -Math.sin(p.yaw), fz_ = -Math.cos(p.yaw), rx_ = Math.cos(p.yaw), rz_ = -Math.sin(p.yaw);
  return Math.atan2(dx * rx_ + dz * rz_, dx * fx_ + dz * fz_);
}
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const HOT = '#ff2390';
function hudPlay() {

  }

  // the pack and its worth, top right
  const cols = 8, rows = Math.ceil(tune.pack_slots / cols), pw = 300, ph = 74 + rows * 26;

  for (let i = 0; i < tune.pack_slots; i++) {

  const ds = dist(p.x, p.z, SHIP.x, SHIP.z), speed = tune.walk_speed * (1 - tune.full_pack_slow * fill);

  plate(W / 2 - 190, H - 66, 380, 48);

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { ctx.clearRect(0, 0, W, H); scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
buildView();
loadPacks();
scene = params.get('scene') || 'title';
if (scene === 'play') startRun();
if (scene === 'home') goHome('title');
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
