# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.3.0
  last_upgraded: 2026-11-09

project:
  stage: Systems Design
  goal: hobby

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/project-settings --local <key>=<value>` writes there; `/project-settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

modes:
  rigor: full
  automation: collaborative

engine:
  name: "Unity"
  version: "6.3 LTS"
  language: "C#"
  rendering: "URP"
  physics: "PhysX"
  path: "C:/Unity/Editor/6000.3.29f1/Editor/Unity.exe"
  code_root: "StarHaul/Assets"
  # test_root: "StarHaul/Assets/Tests"   # add when the folder exists (/test-setup); a missing folder makes the value invalid

specialists:
  code: "unity-specialist"
  shader: "unity-shader-specialist"
  ui: "unity-ui-specialist"
  additional: ["unity-dots-specialist", "unity-addressables-specialist"]

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE   # UNVERIFIED — not sourceable from docs/engine-reference/unity/; confirm before relying on it
  signals: PascalCase On<Event>
  files: PascalCase
  scenes: PascalCase

commands:
  # Editor 6000.3.29f1 at C:/Unity/Editor (verified 2026-11-26). Project folder: StarHaul.
  # TODO: output paths are unverified until the first build and test run.
  build: '"C:/Unity/Editor/6000.3.29f1/Editor/Unity.exe" -batchmode -quit -projectPath StarHaul -buildTarget StandaloneWindows64 -buildWindows64Player Builds/Win64/StarHaul.exe'
  test: '"C:/Unity/Editor/6000.3.29f1/Editor/Unity.exe" -batchmode -runTests -projectPath StarHaul -testPlatform EditMode -testResults test-results/editmode.xml'
  run: "StarHaul/Builds/Win64/StarHaul.exe -screen-width 1280 -screen-height 720 -screen-fullscreen 0"
  smoke: '"C:/Unity/Editor/6000.3.29f1/Editor/Unity.exe" -batchmode -quit -projectPath StarHaul -logFile -'
